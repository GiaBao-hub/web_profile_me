  <audio id="audioEl" preload="metadata"></audio>

  <script>
    const tracks = [
      { id: 'track-1', title: 'Nắng Dưới Chân Mây (Remix)', src: './assets/aistudio/N_ng_D__i_Ch_n_M_y__Thazh_x___ng_Remix__-_Nguy_n_H_u_Kha___Tr__L_i_Em_Nh_ng_N_i_Bu_n_Remix_TikTok-153029190_b848753d.mp3', duration: 206 },
      { id: 'track-2', title: 'Trúc Xinh', src: './assets/aistudio/Truc_Xinh-1292763833_934f27d1.mp3', duration: 174 },
      { id: 'track-3', title: '3IN1 Đổi Tình Đổi Áo X Nhớ Về Em (Remix)', src: './assets/aistudio/3IN1___I_T_NH___I__O_X_NH__V__EM_X_L__DO_L__G__REMIX_4ed787a1.mp3', duration: 254 },
      { id: 'track-4', title: 'Chill Lo-Fi Evening', src: 'https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3', duration: 147 },
      { id: 'track-5', title: 'Vietnamese Chill Beats', src: 'https://cdn.pixabay.com/download/audio/2022/01/18/audio_d0a13f69d2.mp3?filename=chill-abstract-intention-12099.mp3', duration: 126 }
    ];

    let currentTrackIndex = 0;
    let isPlaying = false;
    let isMuted = false;

    const audio = document.getElementById('audioEl');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const trackTitle = document.getElementById('trackTitle');
    const seekSlider = document.getElementById('seekSlider');
    const currentTimeText = document.getElementById('currentTimeText');
    const durationText = document.getElementById('durationText');
    const muteBtn = document.getElementById('muteBtn');
    const volumeIcon = document.getElementById('volumeIcon');
    const playlistBtn = document.getElementById('playlistBtn');
    const playlistDrawer = document.getElementById('playlistDrawer');
    const playlistItems = document.getElementById('playlistItems');
    const openPlaylistTop = document.getElementById('openPlaylistTop');

    // Nút âm thanh video banner
    const bannerVideo = document.getElementById('bannerVideo');
    const toggleVideoSound = document.getElementById('toggleVideoSound');
    const videoSoundIcon = document.getElementById('videoSoundIcon');

    toggleVideoSound.addEventListener('click', () => {
      bannerVideo.muted = !bannerVideo.muted;
      if (bannerVideo.muted) {
        videoSoundIcon.setAttribute('data-lucide', 'volume-x');
        videoSoundIcon.className = 'w-3.5 h-3.5';
      } else {
        videoSoundIcon.setAttribute('data-lucide', 'volume-2');
        videoSoundIcon.className = 'w-3.5 h-3.5 text-amber-400';
      }
      lucide.createIcons();
    });

    function formatTime(sec) {
      if (!sec || isNaN(sec)) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function renderPlaylist() {
      playlistItems.innerHTML = tracks.map((t, idx) => {
        const active = idx === currentTrackIndex;
        return `
          <div onclick="selectTrack(${idx})" class="w-full px-3 py-2.5 rounded-xl flex items-center justify-between text-left transition-all cursor-pointer group ${
            active ? 'bg-amber-400/15 border border-amber-400/30 text-amber-300 shadow-sm' : 'hover:bg-white/5 text-stone-300 border border-transparent'
          }">
            <div class="flex items-center gap-2.5 min-w-0 pr-2">
              <span class="text-xs shrink-0 ${active ? 'text-amber-400' : 'opacity-60'}">♪</span>
              <p class="font-medium text-xs text-white truncate">${t.title}</p>
            </div>
            ${active ? `<span class="text-[11px] font-semibold text-amber-400 uppercase tracking-wider shrink-0">${isPlaying ? 'Đang phát' : 'Đang chọn'}</span>` : ''}
          </div>
        `;
      }).join('');
    }

    // Đổi nhạc là dừng và nạp sẵn (tránh lỗi ngắt âm trên điện thoại)
    function selectTrack(index) {
      currentTrackIndex = index;
      const t = tracks[currentTrackIndex];
      trackTitle.textContent = t.title;
      audio.pause();
      audio.src = t.src;
      audio.currentTime = 0;
      isPlaying = false;
      seekSlider.value = 0;
      currentTimeText.textContent = '0:00';
      durationText.textContent = formatTime(t.duration);
      playIcon.setAttribute('data-lucide', 'play');
      playIcon.classList.add('ml-0.5');
      playlistDrawer.classList.add('hidden');
      renderPlaylist();
      lucide.createIcons();
    }

    function togglePlay() {
      if (isPlaying) {
        audio.pause();
        isPlaying = false;
        playIcon.setAttribute('data-lucide', 'play');
        playIcon.classList.add('ml-0.5');
      } else {
        if (!audio.src || audio.src === '') {
          audio.src = tracks[currentTrackIndex].src;
        }
        audio.play().then(() => {
          isPlaying = true;
          playIcon.setAttribute('data-lucide', 'pause');
          playIcon.classList.remove('ml-0.5');
          renderPlaylist();
          lucide.createIcons();
        }).catch((e) => console.log('Audio play error:', e));
      }
      renderPlaylist();
      lucide.createIcons();
    }

    playBtn.addEventListener('click', togglePlay);
    playlistBtn.addEventListener('click', () => playlistDrawer.classList.toggle('hidden'));
    openPlaylistTop.addEventListener('click', () => playlistDrawer.classList.toggle('hidden'));

    audio.addEventListener('timeupdate', () => {
      if (!isNaN(audio.currentTime)) {
        seekSlider.value = audio.currentTime;
        currentTimeText.textContent = formatTime(audio.currentTime);
      }
      if (!isNaN(audio.duration) && audio.duration > 0) {
        seekSlider.max = audio.duration;
        durationText.textContent = formatTime(audio.duration);
      }
    });

    seekSlider.addEventListener('input', (e) => {
      audio.currentTime = parseFloat(e.target.value);
    });

    muteBtn.addEventListener('click', () => {
      isMuted = !isMuted;
      audio.muted = isMuted;
      volumeIcon.setAttribute('data-lucide', isMuted ? 'volume-x' : 'volume-2');
      volumeIcon.className = isMuted ? 'w-4 h-4 text-amber-400' : 'w-4 h-4'                   <i class="fa-solid fa-plus text-[10px]"></i> Thêm nhạc
                    </button>
                    <!-- Equalizer Animation (Sóng âm) -->
                    <div id="equalizer" class="flex items-end gap-1 h-5 opacity-40 transition-opacity duration-300">
                        <span class="eq-bar w-1 bg-cyan-400 rounded-full animate-wave"></span>
                        <span class="eq-bar w-1 bg-cyan-400 rounded-full animate-wave"></span>
                        <span class="eq-bar w-1 bg-cyan-400 rounded-full animate-wave"></span>
                        <span class="eq-bar w-1 bg-cyan-400 rounded-full animate-wave"></span>
                    </div>
                </div>
            </div>

            <!-- Thông tin bài hát -->
            <div class="flex items-center gap-3.5 mb-3">
                <img id="song-cover" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?q=80&w=200&auto=format&fit=crop" 
                     alt="Cover" class="w-12 h-12 rounded-xl object-cover shadow-md border border-white/10">
                <div class="flex-1 min-w-0">
                    <h3 id="song-title" class="text-sm font-bold text-white truncate">Lofi Study & Relax</h3>
                    <p id="song-artist" class="text-xs text-slate-400 truncate">Chill Beats Studio</p>
                </div>
            </div>

            <!-- Thanh Progress Bar (Tua nhạc) -->
            <div class="space-y-1 mb-3">
                <div class="relative flex items-center">
                    <input type="range" id="progress-bar" min="0" max="100" value="0" class="w-full cursor-pointer">
                </div>
                <div class="flex justify-between text-[10px] text-slate-400 font-mono">
                    <span id="current-time">0:00</span>
                    <span id="duration-time">0:00</span>
                </div>
            </div>

            <!-- Điều khiển nhạc -->
            <div class="flex items-center justify-between pt-1">
                <!-- Nút Danh sách phát -->
                <button id="playlist-toggle-btn" onclick="togglePlaylist()" class="text-slate-400 hover:text-cyan-400 transition-colors p-1.5 text-xs" title="Danh sách bài hát">
                    <i class="fa-solid fa-list-ul text-sm"></i>
                </button>

                <!-- Điều khiển chính: Back, Play/Pause, Next -->
                <div class="flex items-center gap-4">
                    <button id="prev-btn" onclick="prevSong()" class="text-slate-300 hover:text-cyan-400 transition-colors p-1" title="Bài trước">
                        <i class="fa-solid fa-backward-step text-base"></i>
                    </button>
                    <button id="play-btn" onclick="togglePlayPause()" class="w-10 h-10 rounded-full bg-gradient-to-r from-cyan-400 to-blue-500 text-slate-950 flex items-center justify-center font-bold shadow-lg hover:scale-105 active:scale-95 transition-all" title="Phát/Tạm dừng">
                        <i id="play-icon" class="fa-solid fa-play ml-0.5 text-sm"></i>
                    </button>
                    <button id="next-btn" onclick="nextSong()" class="text-slate-300 hover:text-cyan-400 transition-colors p-1" title="Bài kế tiếp (Đổi bài)">
                        <i class="fa-solid fa-forward-step text-base"></i>
                    </button>
                </div>

                <!-- Điều khiển âm lượng -->
                <div class="flex items-center gap-1.5">
                    <button id="mute-btn" onclick="toggleMute()" class="text-slate-400 hover:text-cyan-400 text-xs p-1" title="Tắt/Mở tiếng">
                        <i id="volume-icon" class="fa-solid fa-volume-high"></i>
                    </button>
                    <input type="range" id="volume-bar" min="0" max="100" value="70" class="w-14 cursor-pointer">
                </div>
            </div>

            <!-- Drawer Danh sách bài hát -->
            <div id="playlist-container" class="hidden mt-4 pt-3 border-t border-white/10 max-h-40 overflow-y-auto space-y-1">
                <p class="text-[11px] text-slate-400 mb-2 font-medium flex justify-between items-center">
                    <span>Danh sách nhạc Lofi:</span>
                    <span id="playlist-count" class="text-cyan-400">3 bài</span>
                </p>
                <div id="playlist-items" class="space-y-1">
                    <!-- Javascript sẽ render playlist vào đây -->
                </div>
            </div>
        </section>

        <!-- FOOTER -->
        <footer class="text-center text-xs text-slate-500 py-4">
            <p>© 2026 <span id="footer-name">Trần Minh Nam</span>. All rights reserved.</p>
            <p class="mt-1 text-[11px] text-slate-600">Được thiết kế tối ưu mượt mà trên Mobile & Desktop</p>
        </footer>

    </main>

    <!-- MODAL CHỈNH SỬA THÔNG TIN CÁ NHÂN -->
    <div id="edit-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-md hidden opacity-0 transition-opacity duration-300">
        <div class="glass-panel w-full max-w-md p-6 rounded-3xl border border-white/20 shadow-2xl relative transform scale-95 transition-transform duration-300">
            <button onclick="closeEditModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-base">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <h2 class="text-lg font-bold text-cyan-300 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-user-pen"></i> Chỉnh sửa Hồ Sơ
            </h2>
            
            <form onsubmit="saveProfile(event)" class="space-y-3.5 text-xs">
                <div>
                    <label class="block text-slate-300 font-medium mb-1">Họ và Tên</label>
                    <input type="text" id="input-name" required class="w-full bg-slate-900/80 border border-slate-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-cyan-400">
                </div>
                <div>
                    <label class="block text-slate-300 font-medium mb-1">Danh xưng / Nghề nghiệp</label>
                    <input type="text" id="input-role" required class="w-full bg-slate-900/80 border border-slate-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-cyan-400">
                </div>
                <div>
                    <label class="block text-slate-300 font-medium mb-1">Đường dẫn Avatar (URL ảnh)</label>
                    <input type="url" id="input-avatar" required class="w-full bg-slate-900/80 border border-slate-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-cyan-400">
                </div>
                <div>
                    <label class="block text-slate-300 font-medium mb-1">Tiểu sử ngắn (Bio)</label>
                    <textarea id="input-bio" rows="3" required class="w-full bg-slate-900/80 border border-slate-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-cyan-400 resize-none"></textarea>
                </div>

                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeEditModal()" class="px-4 py-2 rounded-xl text-slate-400 hover:bg-white/5 transition-colors">Hủy</button>
                    <button type="submit" class="px-5 py-2 rounded-xl bg-gradient-to-r from-cyan-400 to-blue-500 text-slate-950 font-bold hover:brightness-110 transition-all">Lưu thay đổi</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL THÊM / SỬA LIÊN KẾT MẠNG XÃ HỘI -->
    <div id="link-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-md hidden opacity-0 transition-opacity duration-300">
        <div class="glass-panel w-full max-w-md p-6 rounded-3xl border border-white/20 shadow-2xl relative transform scale-95 transition-transform duration-300">
            <button onclick="closeLinkModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-base">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <h2 id="link-modal-title" class="text-lg font-bold text-cyan-300 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-link"></i> Thêm Liên Kết Mới
            </h2>
            
            <form onsubmit="saveSocialLink(event)" class="space-y-3.5 text-xs">
                <input type="hidden" id="input-link-id">
                <div>
                    <label class="block text-slate-300 font-medium mb-1">Nền tảng mạng xã hội</label>
                    <select id="input-link-platform" class="w-full bg-slate-900/80 border border-slate-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-cyan-400">
                        <option value="facebook">Facebook</option>
                        <option value="tiktok">TikTok</option>
                        <option value="youtube">YouTube</option>
                        <option value="instagram">Instagram</option>
                        <option value="github">GitHub</option>
                        <option value="linkedin">LinkedIn</option>
                        <option value="globe">Website Khác</option>
                    </select>
                </div>
                <div>
                    <label class="block text-slate-300 font-medium mb-1">Tên hiển thị</label>
                    <input type="text" id="input-link-title" placeholder="VD: Trang Facebook cá nhân" required class="w-full bg-slate-900/80 border border-slate-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-cyan-400">
                </div>
                <div>
                    <label class="block text-slate-300 font-medium mb-1">Mô tả ngắn</label>
                    <input type="text" id="input-link-subtitle" placeholder="VD: Theo dõi các bài viết hàng ngày" required class="w-full bg-slate-900/80 border border-slate-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-cyan-400">
  </div>
